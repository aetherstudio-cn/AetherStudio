[package]
name = "aether-remote"
version.workspace = true
edition.workspace = true

[dependencies]
aether-db = { path = "../aether-db" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-escape = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
petgraph = "0.6"
tracing = "0.1"
prometheus = "0.13"
anyhow = "1"
thiserror = "1"
supabase-realtime-rs = "0.1"
reqwest = { version = "0.12", features = ["json"] }
shell-words = "1.1"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
tracing-subscriber = "0.3"
