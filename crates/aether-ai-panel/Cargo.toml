[package]
name = "aether-ai-panel"
version.workspace = true
edition.workspace = true

[dependencies]
aether-core = { path = "../aether-core" }
aether-shared = { path = "../aether-shared" }
aether-ai = { path = "../aether-ai" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
ureq = { version = "2.9", features = ["json"] }
sha2 = "0.10"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
memmap2 = "0.9"
dirs = "5.0"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
