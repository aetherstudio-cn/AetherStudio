[package]
name = "aether-ui"
version.workspace = true
edition.workspace = true

[dependencies]
aether-core = { path = "../aether-core" }
aether-render = { path = "../aether-render" }
aether-shared = { path = "../aether-shared" }
aether-remote = { path = "../aether-remote" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
ureq = { version = "2.9", features = ["json"] }
sha2 = "0.10"
dirs = "5.0"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_DirectWrite", "Win32_System_Com", "Win32_UI_Input_Ime", "Win32_System_DataExchange", "Win32_System_Diagnostics", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Console", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_System_Ole", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices"] }
windows-core = "0.58"
