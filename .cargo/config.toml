[http]
timeout = 120
low-speed-limit = 10

#  crates.io 镜像源统一由用户级 ~/.cargo/config.toml 配置（rsproxy-sparse），
#  项目级不再重复定义，避免同名 sparse 源冲突。

[build]
target = "x86_64-pc-windows-msvc"
rustflags = ["-C", "target-cpu=sandybridge"]

[env]
# C/C++ 依赖（esaxx-rs/onig_sys 等 cc 构建）默认 /MT 静态 CRT，
# 与 onnxruntime 预编译库（/MD）及 Rust 运行时（/MD）冲突，
# 导致 cargo test 链接期 LNK2038 RuntimeLibrary 不匹配。统一为 /MD。
CFLAGS = "/MD"
CXXFLAGS = "/MD"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
debug = false
strip = true
incremental = false
